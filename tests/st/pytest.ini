[tool.pytest.ini_options]
testpaths = ["tests/st"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Markers
markers = [
    "cpu_mock: CPU Mock mode tests (fast CI gate)",
    "npu_real: NPU Real mode tests (requires real NPU hardware)",
    "npu_performance: NPU performance tests",
    "npu_precision: NPU precision verification tests",
    "integration: Integration tests",
]

# Execution time threshold
timeout = 300

# Parallel execution
addopts = "-v --tb=short --strict-markers"

# Filter warnings
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# Log configuration
log_cli = false
log_cli_level = "INFO"

# Coverage configuration (when using pytest-cov)
# These are overridden by command-line options
# CI fast configuration - optimized for quick execution
default:
  exec_mode: cpu_mock
  timeout: 60
  batch_size: [1, 16]
  dtype: ["float16"]
  seq_len: [128]

# Minimal models for CI fast
models:
  default_model:
    name: "Qwen/Qwen2.5-0.5B-Instruct"
    max_model_len: 512
    dtype: "float16"

# Minimal tests for CI fast
tests:
  default_test:
    exec_mode: cpu_mock
    timeout: 60
    
  worker_test:
    exec_mode: cpu_mock
    timeout: 30
    batch_size: [1, 16]
    
  scheduler_test:
    exec_mode: cpu_mock
    timeout: 30
    num_running_reqs: [1, 16]
    
  attention_test:
    exec_mode: cpu_mock
    timeout: 30
    seq_len: [128]
    
  quantization_test:
    exec_mode: cpu_mock
    timeout: 30
    quant_method: ["w8a8"]
    
  distributed_test:
    exec_mode: cpu_mock
    timeout: 30
    world_size: [1, 2]
    
  sample_test:
    exec_mode: cpu_mock
    timeout: 30
    batch_size: [1, 16]
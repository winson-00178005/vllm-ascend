# Default configuration
default:
  exec_mode: auto
  timeout: 300
  batch_size: [1, 16, 32]
  dtype: ["float16", "bfloat16"]
  seq_len: [128, 512, 1024]

# Models configuration
models:
  default_model:
    name: "Qwen/Qwen2.5-0.5B-Instruct"
    max_model_len: 2048
    dtype: "float16"
    
  Qwen-0.5B:
    name: "Qwen/Qwen2.5-0.5B-Instruct"
    max_model_len: 2048
    dtype: "float16"
    batch_size: [1, 16, 32]
    
  Qwen-7B:
    name: "Qwen/Qwen2.5-7B-Instruct"
    max_model_len: 4096
    dtype: "bfloat16"
    batch_size: [1, 8, 16]

# Tests configuration
tests:
  default_test:
    exec_mode: auto
    timeout: 300
    
  worker_test:
    exec_mode: cpu_mock
    timeout: 120
    batch_size: [1, 16, 32]
    dtype: ["float16", "bfloat16"]
    
  scheduler_test:
    exec_mode: cpu_mock
    timeout: 120
    num_running_reqs: [1, 16, 32, 64]
    token_budget: [256, 512, 1024, 2048]
    
  attention_test:
    exec_mode: cpu_mock
    timeout: 120
    seq_len: [128, 512, 1024]
    mask_type: ["full", "causal", "sliding_window"]
    
  quantization_test:
    exec_mode: cpu_mock
    timeout: 120
    quant_method: ["w8a8", "w8a8_dynamic", "w4a8"]
    
  distributed_test:
    exec_mode: cpu_mock
    timeout: 120
    world_size: [1, 2, 4, 8]
    
  sample_test:
    exec_mode: cpu_mock
    timeout: 120
    batch_size: [1, 16, 32]
    temperature: [0.0, 0.5, 0.7, 0.9, 1.0]